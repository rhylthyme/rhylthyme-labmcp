[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhylthyme-labmcp"
version = "0.1.0a0"
description = "Run LabMCP lab-instrument MCP servers from Rhylthyme schedules"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.12"
authors = [{ name = "Rhylthyme" }]
dependencies = [
    # The MCP client the runner talks to each LabMCP server with
    "mcp>=1.9",
    # Checks steps against the catalogued tools' input schemas
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://rhylthyme.com"
Source = "https://github.com/rhylthyme/rhylthyme-labmcp"

[tool.setuptools]
# Only [tool.setuptools.package-data] goes into the wheel (MANIFEST.in is for the sdist)
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The catalogue; the parity cases (catalog/labmcp-check-cases.json) are for
# tests and the hosted validator only, so they stay in the sdist, not the wheel
rhylthyme_labmcp = ["py.typed", "catalog/labmcp-catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: launches real LabMCP servers with uvx (simulated)"]
