name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rhylthyme-labmcp and the Rhylthyme runner
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -e ".[dev]" "rhylthyme-cli-runner @ git+https://github.com/rhylthyme/rhylthyme-cli-runner"
      - name: Unit tests
        run: pytest -m "not integration"
      - name: Integration tests (real LabMCP servers, simulated)
        run: pytest -m integration -rs
